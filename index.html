<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var userPref = localStorage.getItem("portfolio_user_theme") || localStorage.getItem("portfolio_theme");
          var theme = "light";
          if (userPref === "light" || userPref === "dark") {
            theme = userPref;
          } else if (window.matchMedia) {
            if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
              theme = "dark";
            } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
              theme = "light";
            }
          }
          var root = document.documentElement;
          if (theme === "dark") {
            root.classList.add("dark");
            root.classList.remove("light");
            root.setAttribute("data-theme", "dark");
            root.style.colorScheme = "dark";
          } else {
            root.classList.add("light");
            root.classList.remove("dark");
            root.setAttribute("data-theme", "light");
            root.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <title>Rashed Pervej | Senior Visualizer Portfolio</title>

    <!-- Dynamic Origin Hydration Script for SEO & Social Metadata -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var path = window.location.pathname;
          var currentUrl = origin + path;

          var canonical = document.querySelector('link[rel="canonical"]');
          if (canonical) canonical.setAttribute('href', currentUrl);

          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) ogUrl.setAttribute('content', currentUrl);

          var twUrl = document.querySelector('meta[name="twitter:url"]');
          if (twUrl) twUrl.setAttribute('content', currentUrl);

          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg) {
            var c = ogImg.getAttribute('content');
            if (c && c.startsWith('/')) ogImg.setAttribute('content', origin + c);
          }

          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg) {
            var tc = twImg.getAttribute('content');
            if (tc && tc.startsWith('/')) twImg.setAttribute('content', origin + tc);
          }

          var schemaEl = document.getElementById('person-schema');
          if (schemaEl) {
            var parsed = JSON.parse(schemaEl.textContent || '{}');
            parsed.url = currentUrl;
            schemaEl.textContent = JSON.stringify(parsed, null, 2);
          }
        } catch(e) {}
      })();
    </script>
